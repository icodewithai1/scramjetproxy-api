<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scramjet Gateway</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #121722; --panel2: #0f1420; --line: #232b3d;
    --text: #e8ecf4; --dim: #8b94a7; --accent: #7aa2ff; --accent2: #49c2ff;
    --ok: #3ddc84; --warn: #ffb454; --err: #ff5d5d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(122,162,255,.12), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(73,194,255,.08), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px 6px; flex-wrap: wrap; }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: .5px; }
  .logo b { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .chips { display: flex; gap: 8px; margin-left: auto; }
  .chip {
    font-size: 12px; color: var(--dim); border: 1px solid var(--line);
    background: var(--panel); padding: 3px 10px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .chip.ok .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .chip.warn .dot { background: var(--warn); }
  .chip.err .dot { background: var(--err); }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 10px 20px 0; }

  /* ---------- home screen ---------- */
  #home { margin: auto; width: min(720px, 100%); text-align: center; }
  #home h1 { font-size: clamp(28px, 5vw, 44px); font-weight: 800; margin-bottom: 8px; }
  #home h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #home p.sub { color: var(--dim); margin-bottom: 26px; }
  #omni { display: flex; gap: 10px; }
  #addr {
    flex: 1; padding: 14px 18px; font-size: 16px; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; outline: none;
  }
  #addr:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(122,162,255,.18); }
  #go {
    padding: 14px 26px; font-size: 16px; font-weight: 700; color: #08101f; border: 0;
    border-radius: 14px; cursor: pointer;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }
  #go:hover { filter: brightness(1.1); }
  .quick { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
  .quick button {
    color: var(--text); background: var(--panel); border: 1px solid var(--line);
    padding: 8px 16px; border-radius: 999px; cursor: pointer; font-size: 14px;
  }
  .quick button:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- browsing ---------- */
  #browse { flex: 1; display: none; flex-direction: column; min-height: 0; }
  #toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
  #toolbar button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 12px; cursor: pointer; font-size: 15px;
  }
  #toolbar button:hover { border-color: var(--accent); }
  #toolbar input {
    flex: 1; padding: 8px 14px; color: var(--dim); font-size: 13px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; outline: none;
  }
  #viewer {
    flex: 1; min-height: 0; border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden; background: #fff; margin-bottom: 10px;
  }
  #viewer iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* ---------- banner / footer ---------- */
  #banner {
    display: none; margin: 14px 20px 0; padding: 12px 16px; border-radius: 12px;
    border: 1px solid rgba(255,93,93,.5); background: rgba(255,93,93,.08);
    color: var(--err); font-size: 14px; white-space: pre-wrap;
  }
  #banner code { background: rgba(0,0,0,.35); padding: 1px 6px; border-radius: 6px; }
  footer { padding: 10px 20px 14px; color: var(--dim); font-size: 12.5px; display: flex; gap: 8px 20px; flex-wrap: wrap; align-items: center; }
  footer a { color: var(--accent); text-decoration: none; }
  footer code { background: var(--panel); border: 1px solid var(--line); padding: 1px 7px; border-radius: 6px; font-size: 12px; }
</style>
</head>
<body>

<header>
  <div class="logo">🛰️ <b>Scramjet</b> Gateway</div>
  <div class="chips">
    <span class="chip" id="chip-sw"><span class="dot"></span>service worker</span>
    <span class="chip" id="chip-wisp"><span class="dot"></span>wisp</span>
  </div>
</header>

<div id="banner"></div>

<main>
  <div id="home">
    <h1>Browse anything, <span>anywhere</span>.</h1>
    <p class="sub">Type a URL or search — requests are rewritten by Scramjet and routed through a Wisp relay.</p>
    <form id="omni">
      <input id="addr" type="text" placeholder="https://example.com  or just search…" autocomplete="off" spellcheck="false" />
      <button id="go" type="submit">Go</button>
    </form>
    <div class="quick">
      <button data-u="https://www.google.com">Google</button>
      <button data-u="https://www.youtube.com">YouTube</button>
      <button data-u="https://www.wikipedia.org">Wikipedia</button>
      <button data-u="https://www.reddit.com">Reddit</button>
      <button data-u="https://github.com">GitHub</button>
      <button data-u="https://discord.com">Discord</button>
    </div>
  </div>

  <div id="browse">
    <div id="toolbar">
      <button id="t-back" title="Back">←</button>
      <button id="t-fwd" title="Forward">→</button>
      <button id="t-reload" title="Reload">⟳</button>
      <input id="t-url" readonly />
      <button id="t-home" title="Home">⌂</button>
    </div>
    <div id="viewer"></div>
  </div>
</main>

<footer>
  <span>Powered by <a href="https://github.com/MercuryWorkshop/scramjet" target="_blank" rel="noopener">Scramjet</a> (Mercury Workshop)</span>
  <span>Link API: open <code id="api-u">yoursite/?u=&lt;encoded url&gt;</code> to jump straight to a proxied site</span>
</footer>

<script>
/* ============================================================================
   Scramjet v2 wiring. Two-file design (this file + server.js as the SW):
   everything else loads from CDN, and the rewriter runtime itself is served
   by the service worker as a virtual file (sj-runtime.js).

   ⚙️ OPTIONAL — use YOUR OWN wisp server instead of the public relays:
       window.WISP_URL = "wss://your-server.com/wisp/";
   ============================================================================ */
window.WISP_URL = "";

/* pinned v2 builds (controller build must match the runtime version) */
const PIN = {
  scramjet:   "https://cdn.jsdelivr.net/npm/@mercuryworkshop/scramjet@2.0.67-alpha.2/dist",
  controller: "https://cdn.jsdelivr.net/npm/@mercuryworkshop/scramjet-controller@0.0.14/dist",
  utils:      "https://cdn.jsdelivr.net/npm/@mercuryworkshop/scramjet-utils@0.0.3/dist/scramjet-utils.js",
  epoxy:      "https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@3.0.1/dist/index.js",
  libcurl:    "https://cdn.jsdelivr.net/npm/@mercuryworkshop/libcurl-transport@2.0.5/dist/index.js",
};

/* public wisp relays, raced/attempted in order when WISP_URL is empty */
const WISP_FALLBACKS = [
  "wss://wisp.mercurywork.shop/",
  "wss://admin.proxy.hydrovolter.com/scramjet/wisp/",
];

const $ = (id) => document.getElementById(id);
const BASE = new URL(".", location.href).pathname; // works on "/" and "/repo-name/"
const PREFIX = BASE + "scramjet/";
const banner = $("banner");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

let controller = null, frame = null, booted = false, chosenWisp = null, transport = null;
const chips = { sw: $("chip-sw"), wisp: $("chip-wisp") };
function setChip(name, state, text) {
  chips[name].className = "chip " + state;
  chips[name].lastChild.textContent = text;
}
function showError(msg) {
  banner.textContent = msg;
  banner.style.display = "block";
}
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = () => rej(new Error("failed to load " + src));
    document.head.appendChild(s);
  });
}
function resolveInput(raw) {
  raw = raw.trim();
  if (!raw) return null;
  if (/^https?:\/\//i.test(raw)) return raw;
  if (/^[\w-]+(\.[\w-]+)+(:\d+)?([\/?#].*)?$/.test(raw)) return "https://" + raw;
  return "https://duckduckgo.com/?q=" + encodeURIComponent(raw);
}

/* older Safari has no BroadcastChannel; the controller only uses it for
   cross-tab cookie sync, so a do-nothing stub keeps it running */
if (!("BroadcastChannel" in window)) {
  window.BroadcastChannel = class {
    postMessage() {} addEventListener() {} removeEventListener() {} close() {}
  };
}

/* ---------- pick a live wisp relay ---------- */
function wispAlive(url, ms = 4500) {
  return new Promise((res, rej) => {
    try {
      const s = new WebSocket(url);
      const t = setTimeout(() => { try { s.close(); } catch {} rej(new Error("timeout")); }, ms);
      s.onopen = () => { clearTimeout(t); try { s.close(); } catch {} res(url); };
      s.onerror = () => { clearTimeout(t); rej(new Error("unreachable")); };
    } catch (e) { rej(e); }
  });
}
async function pickWisp(skip = []) {
  const params = new URLSearchParams(location.search);
  const forced = params.get("wisp"); // escape hatch: ?wisp=wss://your.server/wisp/
  const list = forced
    ? [forced]
    : window.WISP_URL
      ? [window.WISP_URL, ...WISP_FALLBACKS]
      : WISP_FALLBACKS;
  const candidates = list.filter((u) => !skip.includes(u));
  const results = await Promise.allSettled(candidates.map((u) => wispAlive(u)));
  for (let i = 0; i < results.length; i++) {
    if (results[i].status === "fulfilled") return candidates[i];
  }
  throw new Error("No wisp relay is reachable. Set window.WISP_URL at the top of index.html (or add ?wisp=wss://... to the URL) to a working wisp endpoint.");
}
/* epoxy = default (browser-like TLS fingerprint -> media sites block it
   less); libcurl = fallback. ?transport=epoxy|libcurl forces one. */
let transportKind = new URLSearchParams(location.search).get("transport") || "epoxy";
async function makeTransport(wisp) {
  const kinds = transportKind === "libcurl" ? ["libcurl", "epoxy"] : ["epoxy", "libcurl"];
  let lastErr = null;
  for (const kind of kinds) {
    try {
      if (kind === "epoxy") await loadScript(PIN.epoxy);
      else await loadScript(PIN.libcurl);
      const Ctor = kind === "epoxy" ? self.EpoxyTransport.default : self.LibcurlTransport.LibcurlClient;
      const client = new Ctor({ wisp });
      for (let k = 0; ; k++) { // init() can race its embedded wasm -> retry
        try { await client.init(); break; }
        catch (e) { if (k > 50) throw e; await sleep(100); }
      }
      transportKind = kind;
      return client;
    } catch (e) {
      lastErr = e;
      console.warn("transport " + kind + " failed:", e);
    }
  }
  throw lastErr || new Error("no transport available");
}

/* proxied URLs look like  <prefix><controllerId>/<frameId>/<encoded real url>
   -> unwrap them back to the real url for the address bar */
function unwrapProxyUrl(href) {
  try {
    const path = new URL(href).pathname;
    if (!path.startsWith(PREFIX)) return href;
    const rest = path.slice(PREFIX.length).split("/");
    if (rest.length < 3) return href;
    let encoded = rest.slice(2).join("/");
    const q = encoded.indexOf("?");
    if (q !== -1) encoded = encoded.slice(0, q);
    return decodeURIComponent(encoded);
  } catch { return href; }
}

/* ---------- official v2 plugins (media cache, live URL, tab handling) ---- */
const deepLink = (u) => location.origin + BASE + "?u=" + encodeURIComponent(u);
function buildPlugins() {
  const U = window.$scramjetUtils;
  const plugins = [];
  if (!U) return plugins;
  try { plugins.push(new U.HttpCachePlugin()); } catch (e) { console.warn("http-cache plugin skipped:", e); }
  try { plugins.push(new U.UrlWatcherPlugin((url) => { $("t-url").value = url; })); } catch {}
  try { plugins.push(new U.CatchEscapedLinksPlugin((url) => deepLink(url.href || String(url)))); } catch {}
  try {
    plugins.push(new U.EventHandlerPlugin());
    plugins.push(new U.LinkHandlerPlugin((href) => window.open(deepLink(href), "_blank")));
  } catch {}
  return plugins;
}

/* ---------- boot ---------- */
async function boot() {
  try {
    setChip("sw", "warn", "service worker…");
    if (!("serviceWorker" in navigator)) throw new Error("This browser doesn't support service workers.");

    await navigator.serviceWorker.register(BASE + "server.js"); // server.js doubles as the SW
    await navigator.serviceWorker.ready;

    // the SW calls clients.claim() on activate; wait for this page to be controlled
    let sw = navigator.serviceWorker.controller;
    for (let i = 0; i < 20 && !sw; i++) { await sleep(150); sw = navigator.serviceWorker.controller; }
    if (!sw) {
      let reloaded = false;
      try { reloaded = !!sessionStorage.getItem("sj-reloaded"); } catch {}
      if (!reloaded) { // one full-reload retry
        try { sessionStorage.setItem("sj-reloaded", "1"); } catch {}
        location.reload();
        return;
      }
      throw new Error("Service worker did not take control of the page.");
    }
    try { sessionStorage.removeItem("sj-reloaded"); } catch {}
    setChip("sw", "ok", "service worker");

    // scramjet runtime (served by the SW as a converted classic script),
    // then the controller API, official utils plugins, then the transport
    await loadScript(BASE + "sj-runtime.js");
    await loadScript(PIN.controller + "/controller.api.js");
    await loadScript(PIN.utils).catch(() => {}); // plugins optional
    await loadScript(PIN.libcurl);

    setChip("wisp", "warn", "wisp…");
    chosenWisp = await pickWisp();
    transport = await makeTransport(chosenWisp);

    controller = new $scramjetController.Controller({
      serviceworker: sw,
      transport,
      config: {
        prefix: PREFIX,
        scramjetPath: BASE + "sj-runtime.js",         // SW virtual file
        injectPath: PIN.controller + "/controller.inject.js",
        wasmPath: PIN.scramjet + "/scramjet.wasm",
      },
      // tougher rewriting tolerance = heavier sites (yt/tiktok/etc) break less
      scramjetConfig: {
        flags: { captureErrors: true, syncxhr: true, allowFailedIntercepts: true },
      },
    });
    await controller.wait();
    booted = true;
    setChip("wisp", "ok", "wisp " + new URL(chosenWisp).host + " · " + transportKind);

    $("api-u").textContent = location.origin + BASE + "?u=<encoded url>";

    const u = new URLSearchParams(location.search).get("u"); // deep link
    if (u) navigate(u);
  } catch (err) {
    setChip("sw", "err", "error");
    showError("Failed to start Scramjet:\n" + ((err && err.stack) || err));
  }
}

/* ---------- navigate ---------- */
async function navigate(raw, wispSkip = []) {
  const url = resolveInput(raw);
  if (!url) return;
  if (!booted) { showError("Still starting up… try again in a second."); return; }
  banner.style.display = "none";

  if (!frame) {
    frame = controller.createFrame(undefined, { plugins: buildPlugins() });
    frame.element.setAttribute("allow", "fullscreen; clipboard-read; clipboard-write; autoplay; encrypted-media; picture-in-picture");
    $("viewer").appendChild(frame.element);
    frame.element.addEventListener("load", () => {
      try { $("t-url").value = unwrapProxyUrl(frame.element.contentWindow.location.href); } catch {}
    });
  }
  $("home").style.display = "none";
  $("browse").style.display = "flex";
  $("t-url").value = url;
  frame.go(url);
}

/* ---------- UI wiring ---------- */
$("omni").addEventListener("submit", (e) => { e.preventDefault(); navigate($("addr").value); });
document.querySelectorAll(".quick button").forEach((b) =>
  b.addEventListener("click", () => { $("addr").value = b.dataset.u; navigate(b.dataset.u); })
);
$("t-back").onclick   = () => { try { frame.back(); } catch {} };
$("t-fwd").onclick    = () => { try { frame.forward(); } catch {} };
$("t-reload").onclick = () => { try { frame.reload(); } catch { if (frame) frame.go($("t-url").value); } };
$("t-home").onclick   = () => { $("browse").style.display = "none"; $("home").style.display = "block"; $("addr").value = ""; $("addr").focus(); };

boot();
</script>

</html>
